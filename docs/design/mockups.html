<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>말또 MVP 화면 목업 — Issue #21</title>
  <style>
    :root{--blue:#007aff;--indigo:#5856d6;--red:#ff3b30;--bg:#f2f2f7;--surface:#fff;--text:#1c1c1e;--sub:#636366;--line:#c6c6c8;--fill:#e5e5ea;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px}
    *{box-sizing:border-box} body{margin:0;background:#d8d8dd;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif} button,input,textarea{font:inherit} button{cursor:default}
    header{padding:32px;max-width:1600px;margin:auto} header h1{font-size:34px;margin:0 0 8px} header p{font-size:17px;margin:0;color:#3a3a3c}.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;font-size:15px}.swatch{display:inline-block;width:18px;height:18px;vertical-align:-4px;margin-right:6px}.current-swatch{background:var(--indigo);border-radius:6px}.done-swatch{color:var(--indigo);font-weight:700}
    .board{max-width:1600px;margin:0 auto 40px;padding:24px 32px 40px;background:#eeeef2;border-radius:28px}.board-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.board h2{font-size:28px;margin:0}.board-head p{margin:0;color:#555}.grid{display:grid;grid-template-columns:repeat(4,minmax(300px,1fr));gap:28px}.frame-wrap h3{font-size:15px;margin:0 0 8px;color:#555;font-weight:600}.phone{height:760px;background:var(--surface);border:10px solid #222;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 12px 28px #0002}.android .phone{border-radius:30px}.statusbar{height:38px;display:flex;justify-content:space-between;padding:11px 18px 0;font-size:12px;font-weight:600}.screen{height:calc(100% - 38px);display:flex;flex-direction:column;position:relative}.nav{padding:8px 16px 12px;display:grid;grid-template-columns:72px 1fr 72px;align-items:center;min-height:52px;border-bottom:1px solid var(--line)}.nav h4{text-align:center;margin:0;font-size:17px}.nav button,.link{border:0;background:none;color:var(--blue);min-height:48px;padding:8px;font-size:17px}.nav .left{text-align:left;padding-left:0}.nav .right{text-align:right;padding-right:0}.large-nav{padding:4px 16px 12px;display:flex;align-items:end;justify-content:space-between}.large-nav h4{font-size:34px;margin:0}.large-nav button{border:0;background:none;color:var(--blue);min-width:48px;min-height:48px;font-size:17px}
    .content{padding:16px;overflow:auto;flex:1}.list{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -16px}.row{min-height:56px;padding:12px 16px;display:flex;align-items:center;border-bottom:1px solid var(--line);font-size:17px}.row:last-child{border:0}.row span:first-child{flex:1}.chev{color:#aaa;font-size:24px}.hint{color:var(--sub);font-size:15px;line-height:1.45}.field{margin-bottom:24px}.field label,.eyebrow{display:block;color:var(--sub);font-size:13px;margin-bottom:8px;text-transform:none}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);font-size:17px;color:var(--text)}.field textarea{height:300px;resize:none;line-height:1.5}.button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;border-radius:12px;padding:10px 14px;font-size:17px;font-weight:600}.primary{background:var(--blue);color:white}.secondary{background:var(--fill);color:var(--blue)}.plain{background:transparent;color:var(--blue);border:1px solid currentColor}.danger{color:var(--red)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}.bottom-actions{padding:12px 16px 20px;border-top:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:48px 1fr;gap:12px}.icon-button{width:48px;min-width:48px;padding:0;font-size:25px}.card{border-radius:16px;background:var(--bg);padding:16px}.empty{display:flex;flex:1;flex-direction:column;justify-content:center;text-align:center;padding:32px}.empty h5{font-size:20px;margin:0 0 8px}.empty .button{margin-top:24px}
    .sheet-dim{position:absolute;inset:0;background:#0005;display:flex;align-items:end}.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:12px 20px 28px}.grabber{width:36px;height:5px;background:#bbb;border-radius:3px;margin:0 auto 20px}.sheet h5,.notice h5{font-size:22px;margin:0 0 20px}.selected{font-size:20px;font-weight:600;margin:4px 0 24px}.stepper{display:flex;align-items:center;justify-content:space-between;border-radius:12px;background:var(--bg);overflow:hidden}.stepper button{width:52px;min-height:52px;border:0;color:var(--blue);background:transparent;font-size:25px}.stepper strong{font-size:18px}
    .reading-status{padding:12px 16px;text-align:center;font-weight:600;font-size:17px;border-bottom:1px solid var(--line)}.transcript{padding:28px 20px;overflow:auto;flex:1;font-size:24px;line-height:1.75}.word{display:inline;box-decoration-break:clone;-webkit-box-decoration-break:clone}.word.done{color:var(--indigo);font-weight:600}.word.current{background:var(--indigo);color:#fff;border-radius:999px;padding:6px 10px;font-weight:600}.word.pending{color:var(--sub)}.reading-title{padding:0 16px 10px;color:var(--sub);font-size:13px}.completion{display:flex;flex:1;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px}.check{width:72px;height:72px;border-radius:50%;background:var(--indigo);color:#fff;font-size:44px;line-height:72px}.completion h5{font-size:28px;margin:24px 0 8px}.completion p{font-size:17px;color:var(--sub);margin:0}.completion .button{margin-top:32px}
    .notice-layer{position:absolute;inset:0;background:#0005;display:flex;align-items:center;padding:20px}.notice{width:100%;background:var(--surface);border-radius:16px;padding:22px;text-align:center}.notice .icon{font-size:34px;margin-bottom:12px}.notice p{color:var(--sub);font-size:16px;line-height:1.45;margin:0}.notice .actions{margin-top:20px}.mock-backdrop{flex:1;background:var(--bg);padding:16px}.mock-line{height:56px;background:var(--surface);border-radius:12px;margin-bottom:12px}
    .xl .phone{height:900px}.xl .screen{font-size:1.18em}.xl .large-nav h4{font-size:42px;line-height:1.1}.xl .large-nav button{font-size:22px}.xl .nav{min-height:68px}.xl .nav h4{font-size:26px;line-height:1.2}.xl .nav button{font-size:20px}.xl .row{font-size:24px;min-height:76px;align-items:center}.xl .field label,.xl .eyebrow{font-size:17px}.xl .field input,.xl .field textarea{font-size:24px}.xl .field textarea{height:360px}.xl .button{min-height:56px;font-size:21px;padding:10px}.xl .icon-button{min-height:56px;width:56px;min-width:56px;font-size:28px}.xl .bottom-actions{grid-template-columns:56px 1fr}.xl .sheet h5,.xl .notice h5{font-size:30px;line-height:1.2}.xl .selected{font-size:27px}.xl .hint,.xl .notice p{font-size:21px}.xl .sheet{max-height:88%;overflow:auto}.xl .reading-status{font-size:23px;text-align:left}.xl .reading-title{font-size:17px}.xl .transcript{font-size:34px;line-height:1.8;padding-top:22px}.xl .completion h5{font-size:36px}.xl .completion p{font-size:23px}.xl .notice-layer{align-items:center;overflow:auto}.xl .notice{max-height:calc(100% - 40px);overflow:auto;padding:24px 18px}.xl .notice .actions{gap:12px}
    .note{font-size:12px;color:#666;margin-top:7px;line-height:1.4}@media(max-width:1200px){.grid{grid-template-columns:repeat(2,minmax(300px,1fr))}}@media(max-width:700px){header,.board{padding-left:14px;padding-right:14px}.grid{grid-template-columns:1fr}.board-head{display:block}.board-head p{margin-top:8px}}
  </style>
</head>
<body>
<header>
  <h1>말또 MVP 전 화면 목업</h1>
  <p>Issue #21 · Cupertino 공통 UI · 기본 글씨와 Accessibility XL · 2026-10-26</p>
  <div class="legend"><span><i class="swatch current-swatch"></i>현재 어절</span><span><i class="swatch done-swatch">가</i> 완료 어절</span><span>회색 일반 글자: 대기 어절</span><span>모든 조작: 최소 48 logical px</span></div>
</header>
<main id="boards"></main>
<script>
const dummyTitle='아침 발음 연습';
const navAction=(position,label)=>`<button class="${position} ${label==='나가기'?'danger':''}">${label}</button>`;
const nav=(title,left='',right='')=>`<div class="nav">${left?navAction('left',left):'<span></span>'}<h4>${title}</h4>${right?navAction('right',right):'<span></span>'}</div>`;
const status=()=>`<div class="statusbar"><span>9:41</span><span>●●● 100%</span></div>`;
const shell=(body, cls='')=>`<div class="phone ${cls}">${status()}<div class="screen">${body}</div></div>`;
const backdrop=()=>`<div class="mock-backdrop"><div class="mock-line"></div><div class="mock-line"></div><div class="mock-line"></div></div>`;
const actions=(primary,secondary)=>`<div class="actions"><button class="button primary">${primary}</button><button class="button plain ${secondary==='나가기'?'danger':''}">${secondary}</button></div>`;
function screens(xl){
 const repeat=`<div class="stepper"><button aria-label="감소">−</button><strong>1회</strong><button aria-label="증가">＋</button></div>`;
 const list=shell(`<div class="large-nav"><h4>대본</h4><button>추가</button></div><div class="content"><div class="list"><div class="row"><span>${dummyTitle}</span><span class="chev">›</span></div><div class="row"><span>천천히 읽기</span><span class="chev">›</span></div></div><p class="hint">대본을 선택하면 낭독 설정이 열립니다.</p></div>`);
 const add=shell(`${nav('대본 추가','취소','저장')}<div class="content"><div class="field"><label>제목</label><input value="${dummyTitle}"></div><div class="field"><label>본문</label><textarea>오늘 읽을 문장을 천천히 또박또박 말합니다.</textarea></div><p class="hint">입력한 내용은 이 기기에만 저장됩니다.</p></div>`);
 const setup=shell(`<div class="large-nav"><h4>대본</h4><button>추가</button></div>${backdrop()}<div class="sheet-dim"><section class="sheet"><div class="grabber"></div><h5>낭독 시작</h5><span class="eyebrow">선택한 대본</span><p class="selected">${dummyTitle}</p><span class="eyebrow">반복 횟수</span>${repeat}${actions('시작','취소')}</section></div>`);
 const reading=shell(`${nav('낭독','','나가기')}<div class="reading-status">2/3회 · 2회 남음</div><div class="reading-title">${dummyTitle}</div><div class="transcript"><span class="word done">오늘</span> <span class="word done">읽을</span> <span class="word current">문장을</span> <span class="word pending">천천히</span> <span class="word pending">또박또박</span> <span class="word pending">말합니다.</span></div><div class="bottom-actions"><button class="button secondary icon-button" aria-label="한 어절 뒤로" title="한 어절 뒤로">↶</button><button class="button plain danger">나가기</button></div>`);
 const complete=shell(`${nav('낭독')}<section class="completion"><div class="check">✓</div><h5>완료</h5><p>3회 낭독했습니다.</p><button class="button primary">목록으로</button></section>`);
 const notice=(title,text,primary,icon)=>shell(`${nav('낭독 시작')} ${backdrop()}<div class="notice-layer"><section class="notice"><div class="icon">${icon}</div><h5>${title}</h5><p>${text}</p>${actions(primary,'나가기')}</section></div>`);
 const denied=notice('마이크 접근이 필요합니다','음성을 인식하려면 시스템 설정에서 마이크와 음성 인식 접근을 허용해 주세요.','설정 열기','🎙');
 const model=notice('한국어 음성 모델이 필요합니다','기기의 온디바이스 한국어 음성 모델을 준비한 뒤 다시 확인해 주세요. 네트워크 인식으로 전환하지 않습니다.','다시 확인','↓');
 const interrupted=shell(`${nav('낭독','','나가기')}<div class="reading-status">2/3회 · 2회 남음</div><div class="transcript"><span class="word done">오늘</span> <span class="word done">읽을</span> <span class="word current">문장을</span> <span class="word pending">천천히</span></div><div class="notice-layer"><section class="notice"><div class="icon">!</div><h5>음성 인식이 중단되었습니다</h5><p>현재 어절과 반복 횟수는 그대로 유지됩니다.</p>${actions('재시도','나가기')}</section></div>`);
 return [
  ['R1 대본 목록',list,'대본 선택이 주 행동'],['R2 대본 추가',add,'제목·본문 저장'],['O1 시작 설정',setup,'기본 1회 · 시작 전 검사'],['R3 낭독',reading,'현재 어절 > 반복 > 뒤로 > 나가기'],
  ['R3 완료',complete,'같은 낭독 View의 완료 상태'],['O2 권한 거부',denied,'설정 열기 또는 나가기'],['O2 모델 미설치',model,'준비 후 다시 확인'],['O3 인식 중단',interrupted,'위치 유지 후 재시도']
 ];
}
function board(platform,xl){const cards=screens(xl).map(([title,html,note])=>`<article class="frame-wrap"><h3>${title}</h3>${html}<p class="note">${note}</p></article>`).join('');return `<section class="board ${platform} ${xl?'xl':''}"><div class="board-head"><h2>${platform==='ios'?'iOS':'Android'} · ${xl?'Accessibility XL':'기본 글씨'}</h2><p>${xl?'동일 UI 구조 · 글자와 터치 영역 확대':'390 × 760 논리 화면 기준'}</p></div><div class="grid">${cards}</div></section>`}
document.querySelector('#boards').innerHTML=board('ios',false)+board('android',false)+board('ios',true)+board('android',true);
</script>
</body>
</html>
